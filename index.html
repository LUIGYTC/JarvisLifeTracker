<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#101828">
  <meta name="description" content="JarvisLifeTracker: demo de tu panel personal de finanzas y vida.">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png">
  <link rel="apple-touch-icon" href="./icons/icon-192.png">
  <link rel="stylesheet" href="./styles.css">
  <title>JarvisLifeTracker</title>
  <script src="./pwa.js" defer></script>
  <script src="./config.js" defer></script>
  <script src="./auth.js" defer></script>
  <script src="./dashboard.js" defer></script>
  <script src="./app.js" defer></script>
</head>
<body>
  <div id="app"></div>
  <noscript>Activa JavaScript para usar JarvisLifeTracker.</noscript>
  <aside class="pwa-panel" aria-label="Instalación y estado de la aplicación">
    <p id="pwa-status" role="status" aria-live="polite"></p>
    <button id="install-app" type="button" hidden>Instalar JarvisLifeTracker</button>
    <button id="update-app" type="button" hidden>Actualizar</button>
    <details id="install-help">
      <summary>Cómo instalar la aplicación</summary>
      <p>Si tu navegador lo permite, usa «Instalar aplicación» en su menú. En iPhone o iPad, abre esta página en Safari y elige Compartir → Añadir a pantalla de inicio. Si ya está instalada, ábrela desde su icono.</p>
    </details>
  </aside>
</body>
</html>
